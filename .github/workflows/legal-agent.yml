name: Legal Agent CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  legal:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run legal:check
      - run: npm run legal:test
      - run: python -m pip install pypdf==6.14.2 reportlab==4.5.1
      - run: python -m unittest discover -s legal/intake -p "test_*.py" -v
      - run: npm run legal:setup
